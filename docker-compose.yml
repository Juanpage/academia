version: '3.9'

services:
  # ─── Core API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academia_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - academia_net

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: academia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-academia_db}
      POSTGRES_USER:     ${POSTGRES_USER:-academia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academia_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academia_net

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: academia_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - academia_net

  # ─── Moodle ────────────────────────────────────────────────────────────────
  moodle:
    image: bitnami/moodle:4
    container_name: academia_moodle
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MOODLE_DATABASE_TYPE:     pgsql
      MOODLE_DATABASE_HOST:     postgres
      MOODLE_DATABASE_PORT_NUMBER: 5432
      MOODLE_DATABASE_NAME:     ${MOODLE_DB:-moodle_db}
      MOODLE_DATABASE_USER:     ${POSTGRES_USER:-academia_user}
      MOODLE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MOODLE_USERNAME:          admin
      MOODLE_PASSWORD:          ${MOODLE_ADMIN_PASSWORD:-Moodle1234!}
      MOODLE_EMAIL:             admin@academia.com
      MOODLE_SITE_NAME:         "Academia Militar Digital"
      MOODLE_LANG:              es
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_data_dir:/bitnami/moodledata
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academia_net

  # ─── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: academia_frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL:    http://api:3000
      NEXT_PUBLIC_MOODLE_URL: http://moodle:8080
    depends_on:
      - api
    networks:
      - academia_net

  # ─── Nginx (Reverse Proxy + SSL) ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: academia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
      - moodle
    networks:
      - academia_net

  # ─── Certbot (SSL automático) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: academia_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    networks:
      - academia_net

volumes:
  postgres_data:
  redis_data:
  moodle_data:
  moodle_data_dir:
  certbot_www:
  certbot_conf:

networks:
  academia_net:
    driver: bridge
