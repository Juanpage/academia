version: '3.9'

services:
  attendance-api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run start:prod"
    volumes:
      - ../../attendance-backend:/app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://attendance:attendance@attendance-db:5432/attendance
      REDIS_URL: redis://attendance-redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: attendance-evidence
      JWT_ACCESS_SECRET: change_me
      JWT_REFRESH_SECRET: change_me_too
    depends_on:
      - attendance-db
      - attendance-redis
      - minio
    ports:
      - '3000:3000'

  attendance-db:
    image: postgres:16
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    volumes:
      - attendance-db-data:/var/lib/postgresql/data
      - ../../docs/attendance/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - '5433:5432'

  attendance-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - attendance-redis-data:/data
    ports:
      - '6380:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - attendance-api
    ports:
      - '8080:80'

volumes:
  attendance-db-data:
  attendance-redis-data:
  minio-data:
